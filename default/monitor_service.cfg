// Monitor service (MOS): streams the entities of the shard to the shard monitor plugin of the
// World Editor, on TCP port 48888 (fixed in the service). Its connections are not authenticated
// unless LoginRequired is set. The development domain binds every service to 127.0.0.1
// (BindAddress), so the plugin runs on the shard machine there. A domain that listens on the
// network needs LoginRequired = 1 with DatabaseHost, DatabaseName, DatabaseLogin and
// DatabasePassword (the nel database; the service takes no port and stops when it cannot connect).

LoginRequired = 0;
